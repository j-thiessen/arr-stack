version: "3"

# ─────────────────────────────────────────────────────────────
# Arr Stack: Prowlarr + Sonarr + Radarr + qBittorrent (behind
# Gluetun/NordVPN kill switch) + Seerr (Overseerr-compatible)
#
# All services share one Docker network (arrstack) so NordVPN's
# host firewall only needs ONE subnet whitelisted, ever.
# See README.md for first-time setup steps.
# ─────────────────────────────────────────────────────────────

services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRY:-Canada}
      - FIREWALL_OUTBOUND_SUBNETS=${ARRSTACK_SUBNET:-172.20.0.0/16}
    ports:
      - "8080:8080"   # qBittorrent WebUI (proxied through gluetun)
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped
    networks:
      - arrstack

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"   # no network of its own — dies with the tunnel
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Toronto}
      - WEBUI_PORT=8080
    volumes:
      - ${DATA_ROOT}/qbittorrent/config:/config
      - ${DOWNLOADS_PATH}:/downloads
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Toronto}
    volumes:
      - ${DATA_ROOT}/prowlarr/config:/config
    ports:
      - "9696:9696"
    restart: unless-stopped
    networks:
      - arrstack

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Toronto}
    volumes:
      - ${DATA_ROOT}/sonarr/config:/config
      - ${TV_PATH}:/tv
      - ${DOWNLOADS_PATH}:/downloads
    ports:
      - "8989:8989"
    restart: unless-stopped
    networks:
      - arrstack

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Toronto}
    volumes:
      - ${DATA_ROOT}/radarr/config:/config
      - ${MOVIES_PATH}:/movies
      - ${DOWNLOADS_PATH}:/downloads
    ports:
      - "7878:7878"
    restart: unless-stopped
    networks:
      - arrstack

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Toronto}
    volumes:
      - ${DATA_ROOT}/seerr/config:/app/config
    ports:
      - "5055:5055"
    restart: unless-stopped
    networks:
      - arrstack

networks:
  arrstack:
    external: true
