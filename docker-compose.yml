# ─────────────────────────────────────────────────────────────
# Arr Stack: Prowlarr + Sonarr + Radarr + qBittorrent (behind
# Gluetun/NordVPN kill switch) + Seerr (Overseerr-compatible)
#
# All services share one Docker network (arrstack) so NordVPN's
# host firewall only needs ONE subnet allowlisted, ever.
# See README.md for first-time setup steps.
#
# Image tags default to :latest but are overridable per service in
# .env (SONARR_TAG=4.0.15 etc). Pin them to what you're already
# running — `docker compose images` — so an update is a deliberate
# bump with a known-good value to roll back to.
# ─────────────────────────────────────────────────────────────

services:
  gluetun:
    image: qmcgaw/gluetun:${GLUETUN_TAG:-latest}
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=${TZ:-America/Toronto}
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRY:-Canada}
      # Comma-separated. The arrstack subnet lets Sonarr/Radarr reach
      # qBittorrent's WebUI; add your LAN subnet (LAN_SUBNET) if you ever set
      # userland-proxy=false in daemon.json, which stops Docker rewriting the
      # source IP to the bridge gateway and would otherwise drop LAN clients.
      - FIREWALL_OUTBOUND_SUBNETS=${ARRSTACK_SUBNET:-172.20.0.0/16}${LAN_SUBNET:+,${LAN_SUBNET}}
      # Refresh the bundled NordVPN server list; a stale one shows up much
      # later as a confusing "no server found".
      - UPDATER_PERIOD=24h
    ports:
      - "8080:8080"   # qBittorrent WebUI (proxied through gluetun)
      # Published, but NordVPN via gluetun does no port forwarding, so these
      # do not get you inbound peer connections. See README.
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped
    networks:
      - arrstack

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:${QBITTORRENT_TAG:-latest}
    container_name: qbittorrent
    network_mode: "service:gluetun"   # no network of its own — dies with the tunnel
    # Wait for the tunnel to be up, not merely for the container to exist.
    # NOTE: qBittorrent borrows gluetun's network namespace, so recreating
    # gluetun leaves this attached to a dead one:
    #   docker compose up -d --force-recreate qbittorrent
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Toronto}
      - WEBUI_PORT=8080
    volumes:
      - ${DATA_ROOT}/qbittorrent/config:/config
      - ${DOWNLOADS_PATH}:/downloads
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:${PROWLARR_TAG:-latest}
    container_name: prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Toronto}
    volumes:
      - ${DATA_ROOT}/prowlarr/config:/config
    ports:
      - "9696:9696"
    restart: unless-stopped
    networks:
      - arrstack

  sonarr:
    image: lscr.io/linuxserver/sonarr:${SONARR_TAG:-latest}
    container_name: sonarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Toronto}
    volumes:
      - ${DATA_ROOT}/sonarr/config:/config
      - ${TV_PATH}:/tv
      - ${DOWNLOADS_PATH}:/downloads
    ports:
      - "8989:8989"
    restart: unless-stopped
    networks:
      - arrstack

  radarr:
    image: lscr.io/linuxserver/radarr:${RADARR_TAG:-latest}
    container_name: radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Toronto}
    volumes:
      - ${DATA_ROOT}/radarr/config:/config
      - ${MOVIES_PATH}:/movies
      - ${DOWNLOADS_PATH}:/downloads
    ports:
      - "7878:7878"
    restart: unless-stopped
    networks:
      - arrstack

  seerr:
    image: ghcr.io/seerr-team/seerr:${SEERR_TAG:-latest}
    container_name: seerr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Toronto}
    volumes:
      - ${DATA_ROOT}/seerr/config:/app/config
    ports:
      - "5055:5055"
    restart: unless-stopped
    networks:
      - arrstack

  plex:
    image: lscr.io/linuxserver/plex:${PLEX_TAG:-latest}
    container_name: plex
    # host networking: required for Plex remote access, LAN discovery,
    # and DLNA — do NOT put this on the arrstack bridge network.
    network_mode: host
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Toronto}
      - VERSION=docker
      # Optional: only needed the first time you link a fresh server to
      # your Plex account. Get a fresh one from https://plex.tv/claim
      # (valid for ~4 minutes) — leave blank on subsequent starts.
      - PLEX_CLAIM=${PLEX_CLAIM:-}
    volumes:
      - ${DATA_ROOT}/plex/config:/config
      - ${TV_PATH}:/tv
      - ${MOVIES_PATH}:/movies
    restart: unless-stopped

  dockerproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:${DOCKERPROXY_TAG:-latest}
    container_name: dockerproxy
    # A read-only window onto the Docker API, so the dashboard can show
    # container state without touching the socket itself. /var/run/docker.sock
    # is root-equivalent on the host, and homepage is the one container here
    # that faces the LAN — this keeps those two facts apart.
    environment:
      - CONTAINERS=1   # GET /containers — the only thing homepage needs
      - POST=0         # no write operations
      # every other endpoint defaults to denied
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Deliberately no `ports:` — reachable only from the arrstack network.
    restart: unless-stopped
    networks:
      - arrstack

  homepage:
    image: ghcr.io/gethomepage/homepage:${HOMEPAGE_TAG:-latest}
    container_name: homepage
    depends_on:
      - dockerproxy
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Toronto}
      # Required since homepage v0.9. Requests whose Host header isn't listed
      # are rejected, and it surfaces as a blank page rather than an error.
      # List every host:port you actually type; on :80 that's a bare host.
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS:-localhost}
      # Referenced from the config YAML as {{HOMEPAGE_VAR_*}}, so the dashboard
      # definition can live in git while the secrets stay in .env.
      - HOMEPAGE_VAR_LAN_IP=${LAN_IP:-localhost}
      - HOMEPAGE_VAR_SONARR_KEY=${SONARR_API_KEY:-}
      - HOMEPAGE_VAR_RADARR_KEY=${RADARR_API_KEY:-}
      - HOMEPAGE_VAR_PROWLARR_KEY=${PROWLARR_API_KEY:-}
      - HOMEPAGE_VAR_SEERR_KEY=${SEERR_API_KEY:-}
      - HOMEPAGE_VAR_PLEX_TOKEN=${PLEX_TOKEN:-}
      - HOMEPAGE_VAR_QBT_USER=${QBT_USERNAME:-}
      - HOMEPAGE_VAR_QBT_PASS=${QBT_PASSWORD:-}
    volumes:
      - ${DATA_ROOT}/homepage/config:/app/config
    ports:
      # homepage listens on 3000 internally. Parameterised so a conflict on
      # :80 is a one-line change in .env rather than an edit here.
      - "${HOMEPAGE_PORT:-80}:3000"
    restart: unless-stopped
    networks:
      - arrstack

networks:
  arrstack:
    external: true
